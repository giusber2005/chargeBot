<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1215">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..800&display=swap" rel="stylesheet">

    <link href="/static/css/styles.css" rel="stylesheet">
    <script type="module" src="{{ url_for('static', filename='scripts/scripts.js') }}"></script>

    <title>{% block title %}{% endblock %} · ChargeBot</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <header class="topbar">
        <a href="/home" class="brand" title="Home: starts a new chat">
            <img src="/static/images/HappyFace-Transparent.png" alt="" class="brand-logo">
            <span>ChargeBot</span>
        </a>

        <div class="charge-chip" data-status="preparing" aria-live="polite">
            <span class="status-dot"></span>
            <span data-field="soc">--</span>
            <span class="chip-sep">·</span>
            <span data-field="remaining">--</span>
        </div>

        <div class="demo-toggle" {% if demo_forced %}title="No API key configured: the website can only run in demo mode"{% else %}title="Answer from the activity data without calling the AI"{% endif %}>
            <label class="switch">
                <input type="checkbox" id="demoToggle" {% if demo_forced %}checked disabled{% endif %}>
                <span class="slider"></span>
            </label>
            <label for="demoToggle">Demo</label>
        </div>
    </header>

    <main class="page">
        {% block body %}{% endblock %}
    </main>
</body>
</html>
